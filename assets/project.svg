<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#61DAFB"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<clipPath id="r"><rect width="900" height="262" rx="16"/></clipPath>

</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}

@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ln{to{stroke-dashoffset:0}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
.fade{opacity:0;animation:fadein .7s ease-out forwards}
.line{stroke-dasharray:520;stroke-dashoffset:520;animation:ln 2.2s .5s ease-out forwards}

</style>
<g clip-path="url(#r)">
<rect width="900" height="262" fill="#0d1117"/>

