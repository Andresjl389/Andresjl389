.card{opacity:0;animation:slide .8s ease-out forwards}
.spine{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.6s .2s ease-out forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
.blink{animation:bl 1.6s ease-in-out infinite}

